<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JD Myliyat - Simba Apparel EPZ Ltd</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(180deg, #1f3a6e 0%, #274b8d 220px, #f2f2f2 220px);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px 60px 16px;
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.25);
    overflow: hidden;
  }
  .header {
    background: #274b8d;
    padding: 28px 24px 60px 24px;
    text-align: center;
    color: #fff;
  }
  .logo {
    width: 56px;
    height: 56px;
    background: #fff;
    border-radius: 50%;
    padding: 8px;
    margin: 0 auto 10px auto;
    display: block;
  }
  .company-name {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: bold;
    font-size: 20px;
    letter-spacing: 0.3px;
  }
  .company-sub {
    font-size: 12px;
    opacity: 0.85;
    margin-top: 2px;
  }
  .photo-wrap {
    margin-top: -46px;
    text-align: center;
  }
  .photo {
    width: 92px;
    height: 92px;
    border-radius: 50%;
    object-fit: cover;
    object-position: 50% 22%;
    border: 4px solid #fff;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  }
  .name {
    text-align: center;
    font-weight: bold;
    font-size: 19px;
    color: #1a1a1a;
    margin-top: 12px;
  }
  .title {
    text-align: center;
    font-family: Georgia, serif;
    font-size: 15px;
    color: #555;
    margin-top: 2px;
  }
  .actions {
    display: flex;
    gap: 10px;
    padding: 18px 24px 6px 24px;
  }
  .btn {
    flex: 1;
    text-align: center;
    padding: 11px 8px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: bold;
    text-decoration: none;
    color: #fff;
  }
  .btn-call { background: #274b8d; }
  .btn-save { background: #f0a93e; color: #1a1a1a; }
  .info-list {
    padding: 14px 24px 22px 24px;
  }
  .info-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid #eee;
    font-size: 14px;
    color: #1a1a1a;
    text-decoration: none;
  }
  .info-row:last-child { border-bottom: none; }
  .info-icon {
    width: 20px;
    text-align: center;
    color: #274b8d;
    font-weight: bold;
  }
  .footer {
    background: #6f6a66;
    color: #f0a93e;
    font-weight: bold;
    text-align: center;
    font-size: 12.5px;
    line-height: 1.5;
    padding: 12px 14px;
  }
</style>
